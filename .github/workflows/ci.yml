name: CI & DevSecOps - Hardened & Secure

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# 🔒 BLINDAGEM 1: Princípio do Menor Privilégio explícito
permissions:
  contents: read

# 🔒 BLINDAGEM 2: Controlo de concorrência (cancela builds obsoletos no mesmo PR)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: 🔍 Qualidade, Linters e Testes (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 10 # 🔒 BLINDAGEM 3: Prevenção contra jobs travados

    steps:
      # 🔒 BLINDAGEM 4: Checkout oficial fixado em versão major imutável
      - name: 📥 Checkout Seguro do Repositório
        uses: actions/checkout@v4

      - name: ⚙️ Setup Go com Cache Nativo
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true # 🔒 BLINDAGEM 5: Cache nativo ativado para acelerar o loop de CI

      - name: 📦 Download de Dependências
        run: go mod download

      - name: 🧹 Verificação de Formatação Go (gofmt)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Arquivos não formatados com gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: 🔎 Execução do golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

      - name: 🧪 Execução de Testes Automatizados (Fail Fast)
        run: go test -v ./... -failfast

  container-validation:
    name: 🐳 Validação e Build dos Contêineres
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Seguro
        uses: actions/checkout@v4

      - name: 📋 Validar Sintaxe dos Arquivos Compose
        run: |
          docker compose --env-file example.env -f docker-compose-dev.yaml config >/dev/null
          docker compose --env-file example.env -f docker-compose-monolito-dev.yaml config >/dev/null
          docker compose --env-file example.env -f docker-compose-monolito-prod.yaml config >/dev/null
          docker compose --env-file example.env -f docker-compose-prod.yaml config >/dev/null

      - name: 🏗️ Build da Imagem Monólito
        run: docker build -f monolito/Dockerfile -t gotodolist-monolito:ci .

      - name: 🏗️ Build da Imagem da API Backend
        run: docker build -f desacoplado/backend/Dockerfile -t gotodolist-api:ci .

      - name: 🏗️ Build da Imagem do Frontend
        run: docker build -f desacoplado/frontend/Dockerfile -t gotodolist-frontend:ci .

  # -------------------------------------------------------------
  # CENÁRIO 3: DEVSECOPS (SAST SEMGREP & CONTAINER TRIVY)
  # -------------------------------------------------------------
  security-scan:
    name: 🛡️ DevSecOps (SAST Semgrep & Container Trivy)
    needs: [lint-and-test] # Encadeado para executar após os testes funcionais
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4

      # ETAPA 1: SAST - Análise Estática de Código com Semgrep
      - name: 🔍 SAST com Semgrep (Regras OWASP Top 10)
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/owasp-top-ten
            p/security-audit

      # ETAPA 2: Build da Imagem de Teste Local (Monólito)
      - name: 🐳 Compilar Imagem Docker Efêmera para Análise
        run: |
          docker build -f monolito/Dockerfile -t app-audit:local .

      # ETAPA 3: Scanner de Vulnerabilidades com Aqua Trivy
      - name: 🛡️ Escanear Imagem Docker com Aqua Security Trivy
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: 'app-audit:local'
          format: 'table'
          # 🚨 QUEBRA O PIPELINE SE HOUVER VULNERABILIDADE GRAVE
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'