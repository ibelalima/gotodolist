name: Release Please & Publish Multi-Arch Container

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write
    packages: write

jobs:
    release-please:
        name: 🤖 Google Release Please (SemVer & Changelog)
        runs-on: ubuntu-latest
        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
            tag_name: ${{ steps.release.outputs.tag_name }}
        steps:
            - name: 🚀 Executar Release Please Engine
              id: release
              uses: googleapis/release-please-action@v4
              with:
                  release-type: simple

    publish-container:
        name: 🐳 Buildx Multi-Arch & Push to GHCR
        needs: [release-please]
        if: ${{ needs.release-please.outputs.release_created == 'true' }}
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: 📥 Checkout do Código na Tag Criada
              uses: actions/checkout@v4
              with:
                  ref: ${{ needs.release-please.outputs.tag_name }}

            - name: 🔧 Configurar Emulação QEMU
              uses: docker/setup-qemu-action@v3

            - name: 🛠️ Configurar Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: 🔑 Autenticação no GitHub Container Registry (GHCR)
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: 🏷️ Extrair Metadados e Tags SemVer Automáticas
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/${{ github.repository }}
                  tags: |
                      type=raw,value=latest
                      type=raw,value=${{ needs.release-please.outputs.tag_name }}
                      type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name }}
                      type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag_name }}

            - name: 🚀 Compilar e Publicar Imagem Multi-Arch
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: monolito/Dockerfile
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
